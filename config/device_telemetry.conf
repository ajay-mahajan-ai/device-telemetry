# device-telemetry configuration
# This file is mounted from the host at /etc/device_telemetry.conf
# Edit on the device before installing the container.

# C collector settings
AMXB_BACKEND=/usr/bin/mods/amxb/mod-amxb-ubus.so
AMXB_SOCKET=ubus:/var/run/ubus.sock
POLL_INTERVAL_SEC=10
METRICS_OUTPUT=/tmp/device_telemetry.json

# Python publisher settings — point to your USP controller
MQTT_BROKER=10.10.10.172
MQTT_PORT=1883
